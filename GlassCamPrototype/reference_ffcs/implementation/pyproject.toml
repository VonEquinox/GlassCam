[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ffcs"
version = "0.1.0"
description = "Deterministic Fujifilm film simulation colour pipeline"
requires-python = ">=3.9"
dependencies = ["Pillow>=9.0"]

[project.optional-dependencies]
raw = ["rawpy>=0.19"]

[project.scripts]
ffcs = "ffcs.cli:main"

[tool.setuptools.packages.find]
include = ["ffcs*"]

[tool.setuptools.package-data]
ffcs = ["data/**/*.lutz", "data/**/*.icc", "data/**/*.json", "data/README.md"]
