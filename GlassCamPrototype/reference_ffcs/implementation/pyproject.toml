[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ffcs"
version = "0.2.0"
description = "Deterministic Fujifilm film simulation colour pipeline"
requires-python = ">=3.10"
dependencies = ["Pillow>=9.1", "numpy>=1.23", "tifffile>=2022.8.12", "imagecodecs>=2022.9.26"]

[project.optional-dependencies]
raw = ["rawpy>=0.19"]
test = ["pytest>=7"]

[project.scripts]
ffcs = "ffcs.cli:main"

[tool.setuptools.packages.find]
include = ["ffcs*"]

[tool.setuptools.package-data]
ffcs = ["data/**/*.lutz", "data/**/*.icc", "data/**/*.json", "data/*.json", "data/README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
